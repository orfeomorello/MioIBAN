<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MioIBAN">
  <title>MioIBAN</title>
  <!--
    Il simbolo e' lo ZERO BARRATO: e' il cuore dell'app.
    Tutta la missione di MioIBAN e' non confondere 0 con O quando si ricopia
    un IBAN a mano allo sportello (MioIBAN-SPEC.md §8.1).
    Il glifo e' disegnato con forme geometriche, non con <text>, cosi' viene
    reso identico su ogni sistema indipendentemente dai font installati.
  -->
  <rect width="512" height="512" rx="96" ry="96" fill="#1d4ed8"/>
  <g fill="none" stroke="#ffffff" stroke-width="52">
    <!-- corpo dello zero -->
    <ellipse cx="256" cy="256" rx="104" ry="136"/>
    <!-- barra diagonale: rende impossibile leggere il glifo come "O" -->
    <line x1="176" y1="352" x2="336" y2="160" stroke-linecap="round"/>
  </g>
</svg>
