<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MioIBAN">
  <title>MioIBAN</title>
  <!--
    Variante MASKABLE: il sistema operativo ritaglia questa icona in una forma
    arbitraria (cerchio, goccia, quadrato arrotondato). Regole rispettate:
    - lo sfondo copre TUTTO il canvas, senza angoli arrotondati propri;
    - il glifo sta dentro la "safe zone" centrale (cerchio di diametro ~80%),
      quindi non viene mai tagliato dal ritaglio del sistema.
  -->
  <rect width="512" height="512" fill="#1d4ed8"/>
  <g fill="none" stroke="#ffffff" stroke-width="40">
    <ellipse cx="256" cy="256" rx="78" ry="102"/>
    <line x1="196" y1="328" x2="316" y2="184" stroke-linecap="round"/>
  </g>
</svg>
